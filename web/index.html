  <style>
    /* Pre-Flutter splash — visible from the instant the HTML parses, long
       before any Dart/JS has run. Removed by flutter_bootstrap.js the
       moment the Flutter engine is ready to paint (see body, bottom).
       Colors match lib/core/constants/app_color.dart so there's no visual
       flash when Flutter takes over. */
    html, body { margin: 0; padding: 0; background: #0B1120; }
    #app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: #0B1120;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      box-sizing: border-box;
      z-index: 9999;
    }
    #app-splash .mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #38BDF8;
      color: #0B1120;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.5px;
    }
    #app-splash h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }
    #app-splash p {
      font-size: 14px;
      color: #94A3B8;
      max-width: 420px;
      line-height: 1.6;
      margin: 0;
    }
    #app-splash nav {
      display: none;
    }
    #app-splash .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid #243244;
      border-top-color: #38BDF8;
      animation: app-splash-spin 0.8s linear infinite;
    }
    @keyframes app-splash-spin {
      to { transform: rotate(360deg); }
    }
    .noscript-banner {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 8px;
      font-size: 13px;
      color: #CBD5E1;
    }
  </style>

<body>
  <!--
    Real, semantic, crawlable markup — not a JS-rendered shadow of the app.
    Flutter Web draws everything to canvas/DOM at runtime, so without this
    the raw HTML a non-JS-executing crawler or link-preview bot fetches is
    otherwise empty. This same markup doubles as the loading screen real
    visitors see before the Flutter engine paints its first frame — it's
    removed automatically the instant that happens (see the script at the
    bottom), so there's no separate "loading" state to maintain.
  -->
  <div id="app-splash" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">MA</div>
    <!--
      Visually hidden (not display:none — that gets discounted by some
      crawlers), so it doesn't clutter the lightweight loading mark above,
      but still gives Google Images an actual crawlable <img> to index —
      the real app shows this same photo once it paints. This is not a
      substitute for buying https://mugheesahmad.dev — see comment near
      the top of <head> about the canonical URL.
    -->
    <img
      src="assets/assets/image/jpeg/profile.jpeg"
      alt="Mughees Ahmad, Senior Flutter and Full-Stack Developer"
      width="1" height="1"
      style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"
    >
    <h1>Mughees Ahmad</h1>

      Senior Flutter &amp; Full-Stack Developer at HBit Technology LLC —
      3+ years building production Flutter, React Native, Angular and
      ASP.NET Core applications.
